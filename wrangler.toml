name = "verse-radar"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "./public/"
run_worker_first = ["/admin", "/manage", "/manage/*", "/event-admin.html", "/deal-admin.html", "/activity-image/*", "/api/*"]

[[durable_objects.bindings]]
name = "PAGE_VIEWS"
class_name = "PageViewCounter"

[exports.PageViewCounter]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 */2 * * *", "*/2 * * * *"]

[vars]
GITHUB_REPO = "VerseRadar/verse-radar"
GITHUB_BRANCH = "main"
MAX_ITEMS = "20"
